name: Build ChatGPT Shortcut APK

on:
  push:
    branches: [chatgpt-shortcut-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: chatgpt-shortcut
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTShortcut-apk
          path: chatgpt-shortcut/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
