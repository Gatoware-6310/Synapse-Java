plugins {
    id 'com.android.application'
}

android {
    namespace 'xyz.gatoware.chatgptshortcut'
    compileSdk 35

    defaultConfig {
        applicationId 'xyz.gatoware.chatgptshortcut'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
